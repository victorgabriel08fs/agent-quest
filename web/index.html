<!doctype html>
<html lang="pt-BR" data-theme="escritorio">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Quest</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/themes.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/scene.css">
<script type="module" src="/js/main.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo" aria-hidden="true">⚔️</span><span>Agent Quest</span></div>
  <div class="sess" id="session-info" hidden>
    <div class="sess-row">
      <select class="sess-select" id="session-select" aria-label="Sessão exibida"></select>
      <button type="button" class="follow" id="session-follow" aria-pressed="true" title="Troca sozinho para a sessão com atividade quando a mostrada passa 30 s sem eventos. Escolher uma sessão no seletor fixa a escolha."><span aria-hidden="true">⟳</span><span class="l">Seguir atividade</span></button>
    </div>
    <div class="sess-alert" id="session-alert"></div>
    <p class="sr-only" id="session-alert-live" role="status" aria-live="polite" aria-atomic="true"></p>
  </div>
  <div class="session" id="stats" role="group" aria-label="Resumo da sessão"></div>
  <div class="top-actions">
    <div id="conn" role="status" aria-label="Conexão"></div>
    <button type="button" class="icon-btn discreet-btn" id="btn-discreet" aria-pressed="false" title="Modo discreto (D): esconde comandos, caminhos, títulos e erros para compartilhar a tela"><span aria-hidden="true">🕶️</span><span class="sr-only">Modo discreto</span></button>
    <button type="button" class="icon-btn" id="btn-legend" title="Legenda (?)" aria-haspopup="dialog"><span aria-hidden="true">?</span><span class="sr-only">Abrir a legenda</span></button>
    <div class="seg" id="theme-toggle" role="group" aria-label="Tema"></div>
  </div>
</header>

<main class="layout">
  <aside class="card party" id="party" aria-labelledby="party-title"></aside>

  <section class="center" aria-label="Ticket e cena">
    <div id="quest-slot"></div>
    <div class="card scene-card">
      <div class="scene" id="scene">
        <div class="stage" id="scene-stage"></div>
        <div class="fx" id="scene-fx" aria-hidden="true"></div>
      </div>
    </div>
  </section>

  <aside class="card feed" id="feed" aria-labelledby="feed-title">
    <div class="card-head" id="feed-head"></div>
    <div class="filters" id="feed-filters" role="group" aria-label="Filtrar por agente" hidden></div>
    <p class="card-empty" id="feed-empty" hidden></p>
    <ol class="entries" id="feed-entries"></ol>
  </aside>
</main>

<p class="foot">Roda 100% local, sem internet · atalhos: <kbd>1</kbd> <kbd>2</kbd> tema, <kbd>T</kbd> alterna, <kbd>D</kbd> modo discreto, <kbd>?</kbd> legenda</p>

<dialog class="legend" id="legend" aria-labelledby="legend-title">
  <div class="lg-head"><h2 id="legend-title">Como ler o painel</h2><button type="button" class="icon-btn" id="legend-close"><span aria-hidden="true">✕</span><span class="sr-only">Fechar a legenda</span></button></div>
  <div class="lg-body" id="legend-body"></div>
</dialog>
<noscript><p class="foot">O painel precisa de JavaScript ligado no navegador.</p></noscript>
</body>
</html>
